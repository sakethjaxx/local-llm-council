[project]
name = "local-llm-council"
version = "0.1.0"
description = "Local-first multi-model AI council: parallel LLM analysis and chairman synthesis on Ollama, with a live web UI and CLI."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LLM Council Contributors" }]
keywords = ["llm", "ollama", "multi-agent", "local-first", "code-review", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.2",
  "Pillow==12.3.0",
  "httpx[socks]==0.28.1",
  "litellm==1.88.6",
  "beautifulsoup4==4.14.3",
  "PyMuPDF==1.27.2.3",
  "duckduckgo_search==8.1.1",
  "numpy==2.4.4",
  "psutil==7.2.2",
  "sentence-transformers==5.6.0",
  "tiktoken==0.12.0",
]

[project.urls]
Homepage = "https://github.com/sakethjaxx/local-llm-council"
Source = "https://github.com/sakethjaxx/local-llm-council"
Issues = "https://github.com/sakethjaxx/local-llm-council/issues"
Changelog = "https://github.com/sakethjaxx/local-llm-council/blob/main/CHANGELOG.md"

[project.scripts]
council = "council.cli:entrypoint"
council-serve = "council.main:start"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["council"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
council = [
  "agent_prompts/**/*",
  "demo_samples/*",
  "migrations/*.sql",
  "presets.json",
  "static/*.html",
  "static/*.js",
  "static/*.css",
  "static/js/*.js",
  "static/css/*.css",
  "static/vendor/*.js",
  "static/vendor/LICENSE.*.txt",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*Pydantic serializer warnings.*:UserWarning",
    "ignore:builtin type SwigPy.*:DeprecationWarning",
    "ignore:builtin type swigvarlink.*:DeprecationWarning",
]
