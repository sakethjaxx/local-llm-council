[project]
name = "llm-council"
version = "0.1.0"
description = "Local-first multi-model AI council"
requires-python = ">=3.12"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.2",
  "anthropic==0.45.0",
  "openai==2.20.0",
  "google-generativeai==0.8.3",
  "Pillow==12.3.0",
  "httpx[socks]==0.28.1",
  "litellm==1.84.10",
  "beautifulsoup4==4.14.3",
  "PyMuPDF==1.27.2.3",
  "duckduckgo_search==8.1.1",
  "numpy==2.4.4",
  "psutil==7.2.2",
  "sentence-transformers==5.4.1",
]

[project.scripts]
council = "council.cli:main"
council-serve = "council.main:start"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
council = ["agent_prompts/**/*", "demo_samples/*", "migrations/*.sql", "presets.json", "static/*"]
