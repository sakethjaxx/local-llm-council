name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      - run: python -m pip check
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: git diff --check
      - run: node --check src/council/static/js/*.js
      - run: node --check src/council/static/app.js
      - run: python tools/ponytail_audit.py
      - run: pytest tests/ -q --ignore=tests/eval

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
